<path d="M365,824 h34 a8,8 0 0 1 8,8 v10 a8,8 0 0 1 -8,8 h-34" fill="none" stroke="#1F2933" stroke-width="1.6" marker-end="url(#solid)"/>
<text x="416" y="838" class="msg" text-anchor="start">emit arcube:cart:updated &#8594; update cart totals / basket</text>
