<line x1="875" y1="1326" x2="365" y2="1326" stroke="#1F2933" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#open)"/>
<text x="620.0" y="1318" text-anchor="middle" class="msg">order confirmed</text>
