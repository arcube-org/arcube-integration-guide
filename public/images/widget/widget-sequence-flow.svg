<text x="750.0" y="1226" text-anchor="middle" class="msg">payment proof (externalPSP)</text>
<line x1="365" y1="1280" x2="875" y2="1280" stroke="#1F2933" stroke-width="1.6"  marker-end="url(#solid)"/>
